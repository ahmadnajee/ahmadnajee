<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="340" viewBox="0 0 1280 340" role="img" aria-labelledby="title desc">
<title id="title">Ahmad Naji — Web Developer</title>
<desc id="desc">A navy banner with teal and violet accents. Computer Science. Building for the web.</desc>
<defs>
